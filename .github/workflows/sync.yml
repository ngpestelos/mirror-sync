name: Sync mirrors
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      dest:
        description: dest name (empty = all)
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: sync-mirrors-${{ github.event.inputs.dest || 'all' }}
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      batches: ${{ steps.set.outputs.batches }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        env:
          ONLY: ${{ github.event.inputs.dest || '' }}
        run: |
          python3 - << 'PY'
          import hashlib, json, math, os, pathlib, sys

          HEAVY_MIN = 90
          NORMAL_BATCH_SIZE = 200

          only = os.environ.get("ONLY", "").strip()
          text = pathlib.Path("mirrors.yml").read_text()
          rows = []
          cur = {}
          for line in text.splitlines():
              s = line.strip()
              if s.startswith("- dest:"):
                  if cur:
                      rows.append(cur)
                  cur = {"dest": s.split(":", 1)[1].strip()}
              elif s.startswith("src:") and cur:
                  cur["src"] = s.split(":", 1)[1].strip()
              elif s.startswith("default:") and cur:
                  cur["default"] = s.split(":", 1)[1].strip()
              elif s.startswith("timeout:") and cur:
                  cur["timeout"] = int(s.split(":", 1)[1].strip())
          if cur:
              rows.append(cur)

          # Default applied before the tier split (matches the original
          # emit-time default; a row missing timeout: must not KeyError here).
          for r in rows:
              r.setdefault("timeout", 60)

          heavy_rows = [r for r in rows if r["timeout"] >= HEAVY_MIN]
          normal_rows = [r for r in rows if r["timeout"] < HEAVY_MIN]

          # Computed from the FULL unfiltered list so a single-dest ONLY
          # dispatch assigns the same batch id that dest would get in a
          # full run (stable concurrency-group collision, not a race).
          num_normal_batches = max(1, math.ceil(len(normal_rows) / NORMAL_BATCH_SIZE)) if normal_rows else 0

          def normal_batch_id(dest):
              h = int(hashlib.sha256(dest.encode()).hexdigest(), 16)
              return h % num_normal_batches

          if only:
              if not all(c.isalnum() or c in "-_." for c in only):
                  print("FAIL dest name not allowlisted charset", file=sys.stderr)
                  sys.exit(1)
              selected = [r for r in rows if r["dest"] == only]
              if not selected:
                  print(f"FAIL dest not in mirrors.yml: {only}", file=sys.stderr)
                  sys.exit(1)
          else:
              selected = rows

          batches = {}
          for r in selected:
              entry = {
                  "dest": r["dest"],
                  "src": r["src"],
                  "default": r["default"],
                  "timeout": r["timeout"],
              }
              if r["timeout"] >= HEAVY_MIN:
                  bid = f"heavy-{r['dest']}"
              else:
                  bid = f"normal-{normal_batch_id(r['dest'])}"
              batches.setdefault(bid, []).append(entry)

          batch_list = [{"id": bid, "entries": entries} for bid, entries in sorted(batches.items())]

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("batches=" + json.dumps(batch_list, separators=(",", ":")) + "\n")
          print(f"jobs={len(selected)} batches={len(batch_list)} normal_batches={num_normal_batches} heavy={len(heavy_rows)} normal={len(normal_rows)}")
          PY

  sync:
    needs: matrix
    if: needs.matrix.outputs.batches != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ startsWith(matrix.batch.id, 'heavy-') && matrix.batch.entries[0].timeout || 300 }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        batch: ${{ fromJSON(needs.matrix.outputs.batches) }}
    concurrency:
      group: sync-batch-${{ matrix.batch.id }}
      cancel-in-progress: false
      queue: max
    env:
      MIRROR_APP_ID: ${{ secrets.MIRROR_APP_ID }}
      MIRROR_APP_PRIVATE_KEY: ${{ secrets.MIRROR_APP_PRIVATE_KEY }}
      MIRROR_PUSH_TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN }}
      DEST_OWNER: ngpestelos-mirrors
    steps:
      - uses: actions/checkout@v4
      - name: App credentials present
        run: |
          if [[ -z "${MIRROR_APP_ID}" || -z "${MIRROR_APP_PRIVATE_KEY}" ]]; then
            echo "FAIL MIRROR_APP_ID or MIRROR_APP_PRIVATE_KEY empty" >&2
            exit 1
          fi
      - name: Sync batch ${{ matrix.batch.id }}
        env:
          ENTRIES_JSON: ${{ toJSON(matrix.batch.entries) }}
        run: bash scripts/sync-batch.sh
